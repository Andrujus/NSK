<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="shell">
      <div class="card">
        <!-- LEFT: BOARD -->
        <div class="left">
          <div class="boardWrap">
            <div id="board" class="board" aria-live="polite"></div>
          </div>

          <div class="stats">
            <div class="pill">⏱ <span>Laikas</span> <b id="time">0</b>s</div>
            <div class="pill">🎯 <span>Bandymų</span> <b id="moves">0</b></div>
            <div class="pill">✅ <span>Porų</span> <b id="pairsLeft">0</b></div>
          </div>

          <div class="msg" id="message">Pasirink sudėtingumą ir pradėk žaidimą.</div>
        </div>

        <!-- RIGHT: INFO / CONTROLS -->
        <aside class="right">
          <h1>Memory Card Game</h1>
          <p class="sub">HTML CSS &amp; JavaScript</p>

          <div class="controls">
            <label class="field">
              <span>Žaidėjas</span>
              <input id="playerName" type="text" placeholder="Įvesk vardą" />
            </label>

            <label class="field">
              <span>Sudėtingumas</span>
              <select id="difficulty">
                <option value="easy">Lengvas (10 porų)</option>
                <option value="hard">Sunkus (15 porų)</option>
              </select>
            </label>

            <div class="btnRow">
              <button id="newGameBtn" class="btn primary">Naujas žaidimas</button>
              <button id="resetScoresBtn" class="btn ghost" title="Ištrina rekordus sesijai">Išvalyti rekordus</button>
            </div>
          </div>

          <div class="scoresBox">
            <h2>Geriausi rezultatai (sesija)</h2>
            <div id="scores" class="scores"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
